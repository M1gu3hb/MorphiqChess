name: CI

# Revisa tipos, pruebas y build en cada push y en cada pull request hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sin permisos de escritura: el flujo solo lee el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Las acciones van fijadas por commit (el comentario indica la versión).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run verify
